# Security-critical mutation profile. The runner enforces the score gate.
test_workspace = true
minimum_test_timeout = 60
additional_cargo_args = ["--locked"]
output = "target/qa/mutation"
examine_globs = [
  "crates/shared-signer/src/account_key.rs",
  "crates/shared-signer/src/anti_klepto.rs",
  "crates/signer-firmware-core/src/entropy/**/*.rs",
  "crates/signer-firmware-core/src/security.rs",
  "crates/signer-firmware-core/src/security/**/*.rs",
  "crates/shared-signer/src/bytes.rs",
  "crates/shared-signer/src/legacy_account_key.rs",
  "crates/shared-signer/src/qr_frame.rs",
  "crates/shared-signer/src/security.rs",
  "crates/kassigner-protocol/src/wire/multisig_descriptor.rs",
  "crates/offline-signer/src/crypto/**/*.rs",
  "crates/offline-signer/src/derivation/**/*.rs",
  "crates/offline-signer/src/transaction/kspt/**/*.rs",
  "crates/offline-signer/src/transaction/std_pskt/**/*.rs",
  "crates/offline-signer/src/transaction/sighash/**/*.rs",
  "crates/online-watcher/src/protocol/**/*.rs",
  "crates/online-watcher/src/privacy/stealth/derivation.rs",
  "crates/online-watcher/src/contracts/zk/proof.rs",
  "crates/online-watcher/src/contracts/zk/crowdfund.rs",
  "crates/online-watcher/src/transaction_builder/**/*.rs",
]
exclude_globs = [
  "**/unit_tests/**",
  "**/tests/**",
  "**/bip39_wordlist.rs",
]
exclude_re = ["impl Debug", "fmt\\(", "message\\("]
