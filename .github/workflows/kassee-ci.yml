name: kassee-ci

on:
  push:
    paths:
      - 'apps/kassee-web/**'
      - 'crates/online-watcher/**'
      - 'crates/kassigner-protocol/**'
      - 'crates/kassigner-sdk/**'
      - 'crates/shared-signer/**'
      - 'qa/config/toolchains.env'
      - 'tools/build/web/**'
      - '.github/workflows/kassee-ci.yml'
  pull_request:
    paths:
      - 'apps/kassee-web/**'
      - 'crates/online-watcher/**'
      - 'crates/kassigner-protocol/**'
      - 'crates/kassigner-sdk/**'
      - 'crates/shared-signer/**'
      - 'qa/config/toolchains.env'
      - 'tools/build/web/**'
      - '.github/workflows/kassee-ci.yml'

  workflow_dispatch:

jobs:
  wasm-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Export pinned toolchain policy
        shell: bash
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' qa/config/toolchains.env >> "$GITHUB_ENV"
      - name: Install pinned stable Rust
        shell: bash
        run: rustup toolchain install "$KASSIGNER_STABLE_RUST" --profile minimal --component rustfmt --component clippy
      - name: KasSee Rust format
        shell: bash
        run: rustup run "$KASSIGNER_STABLE_RUST" cargo fmt --manifest-path apps/kassee-web/Cargo.toml --package kassee-web -- --check
      - name: KasSee Clippy
        shell: bash
        run: rustup run "$KASSIGNER_STABLE_RUST" cargo clippy --manifest-path apps/kassee-web/Cargo.toml --locked -- -D warnings
      - name: Cargo audit (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          rustup run "$KASSIGNER_STABLE_RUST" cargo install cargo-audit --locked
          rustup run "$KASSIGNER_STABLE_RUST" cargo audit
