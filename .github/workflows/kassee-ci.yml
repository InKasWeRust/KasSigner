# kassee (KasSee Web) CI — lint + audit for the wasm crate.
# Place at repo root: .github/workflows/kassee-ci.yml
# Toolchain pinned to 1.94.1 — the stable that formats this codebase —
# so rustfmt/clippy results agree between CI and the dev machine. The
# firmware's reproducible Docker build stays pinned separately (1.85.0
# in Dockerfile.base); this lint job does not need to match it.
name: kassee CI

on:
  push:
    paths: ["kassee/**"]
  pull_request:
    paths: ["kassee/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.94.1"

jobs:
  lint:
    name: fmt + clippy (wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kassee
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kassee
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (wasm target, deny warnings)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: kassee
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2025-0055 (tracing-subscriber 0.2.x, ANSI escapes in logs):
      # transitive dep of the arkworks ZK stack; not used for untrusted
      # input logging in KasSee. Reviewed and accepted 2026-07-03.
      - run: cargo audit --ignore RUSTSEC-2025-0055
