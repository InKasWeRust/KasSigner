name: android

on:
  push:
    paths:
      - 'apps/kassee-android/**'
      - 'apps/kassee-web/**'
      - 'crates/online-watcher/**'
      - 'crates/kassigner-protocol/**'
      - 'crates/kassigner-sdk/**'
      - 'scripts/linux/build/android-build.sh'
      - 'scripts/windows/build/android-build.ps1'
      - 'scripts/common/lib/make_tasks.py'
      - 'qa/config/toolchains.env'
      - 'tools/build/web/**'
      - 'tools/build/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/kassee-android/**'
      - 'apps/kassee-web/**'
      - 'crates/online-watcher/**'
      - 'crates/kassigner-protocol/**'
      - 'crates/kassigner-sdk/**'
      - 'scripts/linux/build/android-build.sh'
      - 'scripts/windows/build/android-build.ps1'
      - 'scripts/common/lib/make_tasks.py'
      - 'qa/config/toolchains.env'
      - 'tools/build/web/**'
      - 'tools/build/android/**'
      - '.github/workflows/android.yml'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Export pinned toolchain policy
        id: toolchains
        shell: bash
        run: |
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' qa/config/toolchains.env >> "$GITHUB_ENV"
          android_jdk="$(sed -n 's/^KASSIGNER_ANDROID_JDK=//p' qa/config/toolchains.env | tail -n1 | tr -d '\r')"
          [[ "$android_jdk" =~ ^[0-9]+$ ]] || { echo "Invalid KASSIGNER_ANDROID_JDK pin: $android_jdk" >&2; exit 1; }
          echo "android_jdk=$android_jdk" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.toolchains.outputs.android_jdk }}
      - name: Install pinned stable Rust
        shell: bash
        run: rustup toolchain install "$KASSIGNER_STABLE_RUST" --profile minimal
      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk_root="$RUNNER_TEMP/kassigner-android-sdk"
          archive="$RUNNER_TEMP/kassigner-android-commandlinetools.zip"
          unpack="$RUNNER_TEMP/kassigner-android-commandlinetools"
          tools_dir="$sdk_root/cmdline-tools/latest"
          rm -rf "$sdk_root" "$archive" "$unpack"
          mkdir -p "$sdk_root/cmdline-tools" "$unpack"
          curl -fL --retry 3 --retry-delay 2 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${KASSIGNER_ANDROID_CMDLINE_TOOLS}_latest.zip" \
            -o "$archive"
          printf '%s  %s\n' "$KASSIGNER_ANDROID_CMDLINE_TOOLS_LINUX_SHA256" "$archive" | sha256sum -c -
          unzip -q "$archive" -d "$unpack"
          [[ -x "$unpack/cmdline-tools/bin/sdkmanager" ]] || { echo "Pinned Android command-line tools archive is malformed" >&2; exit 1; }
          mv "$unpack/cmdline-tools" "$tools_dir"
          sdkmanager_bin="$tools_dir/bin/sdkmanager"

          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$tools_dir/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

          yes | "$sdkmanager_bin" --sdk_root="$sdk_root" --licenses >/dev/null 2>&1 || true
          available="$("$sdkmanager_bin" --sdk_root="$sdk_root" --list --channel=3)"
          platform_package=""
          for candidate in \
            "platforms;android-${KASSIGNER_ANDROID_API}" \
            "platforms;android-${KASSIGNER_ANDROID_API}.0"; do
            if awk -F'|' -v candidate="$candidate" '
              { value=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); if (value == candidate) found=1 }
              END { exit(found ? 0 : 1) }
            ' <<<"$available"; then
              platform_package="$candidate"
              break
            fi
          done
          if [[ -z "$platform_package" ]]; then
            echo "No published Android SDK platform package was found for API ${KASSIGNER_ANDROID_API}." >&2
            printf '%s\n' "$available" | grep -F "platforms;android-${KASSIGNER_ANDROID_API}" >&2 || true
            exit 1
          fi
          echo "Installing Android SDK platform package: $platform_package"
          "$sdkmanager_bin" --sdk_root="$sdk_root" --channel=3 \
            "platform-tools" \
            "$platform_package" \
            "build-tools;${KASSIGNER_ANDROID_BUILD_TOOLS}"
      - name: Android tests
        run: make android-test
