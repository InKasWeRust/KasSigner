# KasSigner — Air-gapped offline signing device for Kaspa
# Copyright (C) 2025-2026 KasSigner Project (kassigner@proton.me)
# License: GPL-3.0-or-later
#
# The release build (`release/Dockerfile`) on a machine that is not the
# maintainer's: GitHub's x86 Linux, where the maintainer's is an ARM Mac
# building for `linux/amd64`. The same source must give the same bytes on
# both, so this run's `SHA256SUMS` and `SIGN.TXT` are compared with the
# maintainer's two clean runs before a release is signed.
#
# It runs by hand (Actions, "Run workflow") and on a version tag, not on
# every push: the build is long, and `crates.yml` already builds the code.
# On a tag it first waits for `crates.yml` to pass on the tagged commit, and
# builds nothing if it did not.
#
# It publishes nothing and holds no key. The hash list and the line to sign
# go on the run's summary page and into its log; the files are gone with
# the machine. The release's files come from the maintainer's build, and
# the line is signed on the maintainer's own unit.
#
# Pinned and limited as `crates.yml`: the outside action by commit, a
# read-only token no checkout keeps, a timeout, and a run a newer one has
# overtaken cancelled.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tag is built only from a commit `crates.yml` passed. That workflow runs
  # on a push to `main`, so the tagged commit has a run there; it is waited
  # for while it runs, and the release stops if it failed, was cancelled
  # (a newer push overtook it: re-run it), or never ran. Only the run's
  # state is read, through GitHub's API with this run's own token, allowed
  # to read Actions and nothing else. The commit comes from the runner's
  # environment, never pasted into the script.
  ci:
    name: crates.yml passed on the tagged commit
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    permissions:
      actions: read
    steps:
      - name: Wait for crates.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest run a push started on the commit: its state, its
          # verdict once done (`-` before), and its page.
          ask() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow crates.yml \
              --event push --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion,url \
              --jq '.[0] // {} | [(.status // "none"),
                (if (.conclusion // "") == "" then "-" else .conclusion end),
                (.url // "-")] | join(" ")'
          }
          start="$(date +%s)"
          while :; do
            answer="$(ask)"
            read -r status conclusion url <<< "$answer"
            waited=$(( $(date +%s) - start ))
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "crates.yml passed on $GITHUB_SHA: $url"
                exit 0
              fi
              echo "::error::crates.yml ended $conclusion on $GITHUB_SHA ($url): a release is built only from a commit it passed"
              exit 1
            fi
            # A run is listed within seconds of its push; ten minutes with
            # none means the commit never reached `main`.
            if [ "$status" = none ] && [ "$waited" -ge 600 ]; then
              echo "::error::crates.yml never ran on $GITHUB_SHA: it runs on a push to main, so push the commit there before tagging it"
              exit 1
            fi
            if [ "$waited" -ge 9000 ]; then
              echo "::error::crates.yml still $status on $GITHUB_SHA after 150 minutes ($url)"
              exit 1
            fi
            echo "crates.yml is $status on $GITHUB_SHA; asked again in a minute"
            sleep 60
          done

  build:
    name: the release build, on x86 Linux
    # After `ci` on a tag. A run by hand skips `ci` and builds all the same.
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # A tag names a version, and the files are named for the one in the
      # root `Cargo.toml`: the two must be the same, or a tag pushed on a
      # tree whose version was not raised builds the old version's files
      # under the new one's name. Asked before the long build, and only of a
      # tag: a run by hand builds whatever its branch holds. The tag's name
      # comes from the runner's environment, never pasted into the script.
      - name: The tag is the version
        if: github.ref_type == 'tag'
        run: |
          version="$(sh release/version.sh)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version: the tag for it is v$version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is version $version"
      # Room for the build. The toolchain and ESP-IDF's image, which the
      # bootloaders are built in, unpack at the same time and do not fit in
      # what the runner leaves free: the first run here stopped on "No space
      # left on device". These are tools the runner comes with and this job
      # never uses; nothing the build reads is touched, since it runs inside
      # Docker. The free space is printed before and after.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # The Dockerfile's own command, from the repository root. Every input
      # is pinned there, so nothing is installed or cached here.
      - name: Build
        run: >-
          docker build --platform linux/amd64 -f release/Dockerfile
          --output type=local,dest=release-out .
      # The files against the list, then both texts where they can be read:
      # the log, and the run's summary page. `SIGN.TXT` ends without a line
      # break, so one is added after it for the page, not to the file.
      - name: The hash list and the line to sign
        working-directory: release-out
        run: |
          sha256sum -c SHA256SUMS
          {
            echo '### SHA256SUMS'
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo '### SIGN.TXT'
            echo '```'
            cat SIGN.TXT
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
