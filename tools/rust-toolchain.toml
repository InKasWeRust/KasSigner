#
# The host tools (gen-hash, gen-keypair, verify, mirror, setup-check) build
# with the same host compiler as core/ and as the release image, so the
# program that computes and signs the firmware hash is not compiled by a
# different toolchain from the one that tested the code it hashes.
#
# Until 1.0.7 the repo root pinned channel = "esp" and this crate inherited
# it, so gen-hash was built by the Xtensa toolchain on every release build.

[toolchain]
channel = "1.85.0"
