# The Xtensa toolchain, for the firmware only. It lives here rather than at
# the repo root so that `cargo` in core/, kassee/ and tools/ resolves the
# host compiler instead: those crates are host-testable by design and the
# root pin made them all ask for `esp`.

[toolchain]
channel = "esp"
