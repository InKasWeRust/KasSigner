# KasSigner — Air-gapped offline signing device for Kaspa
# Copyright (C) 2025-2026 KasSigner Project (kassigner@proton.me)
# License: GPL-3.0
#
# kassigner-core: the hardware-free half of the firmware. Key derivation,
# mnemonics, KSPT/PSKT parsing and serialization, sighash, Schnorr, storage
# encryption, the QR payload classifier and the extended pubkey bank scan.
# `#![no_std]` + `alloc`, no esp-hal, no peripheral access. The firmware
# consumes it as a path dependency and re-exports its modules under the
# paths the rest of the firmware has always used; the same crate builds and
# tests on a host with plain `cargo test`.
#
# Everything the crate needs from the hardware arrives through two
# registration points, both set once by the firmware at boot:
#   log::set_logger      the serial printer (nothing registered = silent)
#   entropy::set_source  the hardware entropy fill (nothing = fail closed)

[package]
name = "kassigner-core"
version = "1.0.7"
edition = "2021"
authors = ["KasSigner Team"]
license = "GPL-3.0"

[features]
default = []
# These three are read by the wallet code and are forwarded from the
# bootloader features of the same name. Semantics unchanged; see
# bootloader/Cargo.toml for what each one is for.
verbose-boot = []
boot-kats-full = []
skip-tests = []
# Exposes fuzz_api (one function per parser) and fuzz_smoke (seed corpus
# and the host mutation loop) to core/fuzz/. Never enabled by the firmware.
fuzz-api = []

[dependencies]
# Same pins as bootloader/Cargo.toml; bootloader/Cargo.lock resolves both
# crates to identical versions since this is a path dependency there.
sha2 = { version = "0.10", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
subtle = { version = "2.6", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "ecdsa"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }
blake2 = { version = "0.10.6", default-features = false }
