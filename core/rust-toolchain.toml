#
# The repo root pins channel = "esp" for the firmware. rustup resolves the
# nearest toolchain file walking up from the working directory, so without
# this one `cd core && cargo test` asks for the Xtensa toolchain and fails
# on any machine that does not have it: exactly what an auditor following
# core/README.md would hit, and what CI hit on 2026-08-27.
#
# 1.85.0 rather than "stable": it is the host compiler Dockerfile.base
# installs, so the release build and a reviewer's run use the same one, and
# no unpinned toolchain is fetched during a reproducible build. rustup
# downloads it automatically on first use.
#
# This does not affect the firmware build, which runs from bootloader/ and
# resolves the root pin; core is compiled as a path dependency under it.

[toolchain]
channel = "1.85.0"
