# cargo-fuzz project for kassigner-core. From core/:
#   cargo +nightly fuzz run kspt_parse
# See fuzz/README.md for the corpus and the full target list.

[package]
name = "kassigner-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kassigner-core = { path = "..", features = ["fuzz-api"] }

[[bin]]
name = "seed_corpus"
path = "seed_corpus.rs"
test = false
doc = false

[[bin]]
name = "kspt_parse"
path = "fuzz_targets/kspt_parse.rs"
test = false
doc = false

[[bin]]
name = "pskt_parse"
path = "fuzz_targets/pskt_parse.rs"
test = false
doc = false

[[bin]]
name = "hex_decode"
path = "fuzz_targets/hex_decode.rs"
test = false
doc = false

[[bin]]
name = "kpub_import"
path = "fuzz_targets/kpub_import.rs"
test = false
doc = false

[[bin]]
name = "xprv_import"
path = "fuzz_targets/xprv_import.rs"
test = false
doc = false

[[bin]]
name = "address_validate"
path = "fuzz_targets/address_validate.rs"
test = false
doc = false

[[bin]]
name = "script_parse"
path = "fuzz_targets/script_parse.rs"
test = false
doc = false

[[bin]]
name = "payload_classify"
path = "fuzz_targets/payload_classify.rs"
test = false
doc = false

[[bin]]
name = "mnemonic_validate"
path = "fuzz_targets/mnemonic_validate.rs"
test = false
doc = false
