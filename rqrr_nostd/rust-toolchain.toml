#
# Same pin, and the same reason, as core/rust-toolchain.toml.
#
# The repo root pins channel = "esp" for the firmware, and rustup resolves the
# nearest toolchain file walking up from the working directory. Without this
# one, `cd rqrr_nostd && cargo test` asks for the Xtensa toolchain and fails on
# any machine that does not have it. It appears to work on a developer box only
# because that box has the esp toolchain installed; a CI runner does not. This
# is the same failure core hit on 2026-08-27.
#
# 1.85.0 rather than "stable": it is the host compiler Dockerfile.base
# installs, so the release build and a reviewer's run use the same one.
#
# This does not affect the firmware build, which runs from bootloader/ and
# resolves the root pin; rqrr is compiled as a path dependency under it.
#
# The file name is rust-toolchain.toml, with a HYPHEN. rustup silently ignores
# rust_toolchain.toml and falls through to the root pin, which is this bug
# again with no error message.

[toolchain]
channel = "1.85.0"
