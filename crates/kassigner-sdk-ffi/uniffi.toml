#
# The names of the generated bindings, keyed by this crate's name. The
# namespace, `kassigner_sdk` (`uniffi::setup_scaffolding!` in `src/lib.rs`),
# names the Python module and the Kotlin file.

[crates.kassigner_sdk_ffi.bindings.swift]
module_name = "KasSignerSdk"
ffi_module_name = "KasSignerSdkFFI"

[crates.kassigner_sdk_ffi.bindings.kotlin]
package_name = "org.kassigner.sdk"
cdylib_name = "kassigner_sdk_ffi"

[crates.kassigner_sdk_ffi.bindings.python]
cdylib_name = "kassigner_sdk_ffi"
