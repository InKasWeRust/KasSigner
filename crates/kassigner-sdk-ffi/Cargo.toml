#
# The SDK for Swift, Kotlin and Python: `kassigner-sdk-host` behind a C
# ABI, the bindings generated by UniFFI from this crate's attributes.
# Level 3, as the SDK; nothing of level 2 is in its tree. A workspace
# member, so `test-all` and `clippy-all` cover it. `build.sh` builds the
# library and the bindings with this crate's own `uniffi-bindgen`, so the
# generator and the runtime are one version.

[package]
name = "kassigner-sdk-ffi"
version.workspace = true
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/InKasWeRust/KasSigner"
description = "KasSigner's companion SDK for Swift, Kotlin and Python, over a C ABI."
keywords = ["kaspa", "kassigner", "ffi", "hardware-wallet", "air-gap"]
categories = ["cryptography::cryptocurrencies"]
rust-version.workspace = true

# Not published: an app takes the SDK, and what it is built from, from the
# GitHub release or from this repository at the release's tag.
publish = false

[lib]
name = "kassigner_sdk_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
kassigner-sdk-host = { path = "../kassigner-sdk-host", version = "1.1.0" }
# The runtime the generated bindings call into, and its generator (`cli`).
uniffi = { version = "0.32", features = ["cli"] }
