[package]
name = "kassigner-sdk"
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Friendly network-free Rust/WASM SDK for integrating KasSigner hardware into wallets"
repository = "https://github.com/InKasWeRust/KasSigner"
keywords = ["kaspa", "wallet", "hardware-wallet", "wasm", "sdk"]
categories = ["cryptography::cryptocurrencies", "wasm"]

[lib]
crate-type = ["rlib"]

[features]
default = ["native"]
native = []
wasm = ["kassigner-protocol/wasm"]

[dependencies]
kassigner-protocol = { version = "=2.0.0", path = "../kassigner-protocol" }
serde = { version = "1", features = ["derive"] }
hex = "0.4"
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
serde_json = "1"
shared-signer = { version = "=2.0.0", path = "../shared-signer" }
