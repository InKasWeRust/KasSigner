#
# The companion's side of a unit, levels 0 and 1 only: `tests/no_keys.rs`
# checks at every test run that no key material is in this crate's tree.

[package]
name = "kassigner-sdk"
version.workspace = true
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/InKasWeRust/KasSigner"
description = "KasSigner's companion side: import what a unit hands over, build its requests, read its replies. No key material."
keywords = ["kaspa", "kassigner", "no-std", "hardware-wallet", "air-gap"]
categories = ["cryptography::cryptocurrencies", "no-std"]
rust-version.workspace = true

# Not published: an app takes the SDK, and what it is built from, from the
# GitHub release or from this repository at the release's tag.
publish = false

[dependencies]
kassigner-kaspa = { path = "../kassigner-kaspa", version = "1.1.0" }
kassigner-protocol = { path = "../kassigner-protocol", version = "1.1.0" }
kassigner-qr = { path = "../kassigner-qr", version = "1.1.0" }
