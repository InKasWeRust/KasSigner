[package]
name = "kassee-web"
version = "2.0.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-only"
description = "KasSee Web WASM application shell"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
wasm-bindgen = "0.2"
online-watcher = { version = "=2.0.0", path = "../../crates/online-watcher" }
kassigner-sdk = { version = "=2.0.0", path = "../../crates/kassigner-sdk" }
serde = "1"
serde_json = "1"
console_error_panic_hook = "0.1"

[workspace]
resolver = "2"

[profile.dev]
opt-level = "s"
overflow-checks = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
overflow-checks = true
