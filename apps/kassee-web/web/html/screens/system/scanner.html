            <section id="screen-scanner" class="screen">
                <div class="screen-content scanner-content">
                    <h2 id="scanner-title">Scan QR Code</h2>
                    <div class="scanner-viewport">
                        <video id="scanner-video" autoplay playsinline></video>
                        <canvas id="scanner-canvas" class="hidden"></canvas>
                        <div class="scanner-guide"></div>
                    </div>
                    <div id="scanner-status" class="scanner-status">
                        Waiting for camera...
                    </div>
                    <button class="btn btn-back" id="btn-scanner-cancel">Back</button>
                </div>
            </section>
