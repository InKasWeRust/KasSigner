            <!-- Multisig Spend screen -->
            <section id="screen-multisig" class="screen">
                <div class="screen-content">
                    <h2>Multisig Spend</h2>
                    <p class="subtitle">Spend from a P2SH multisig address</p>
                    <div class="card">
                        <label class="input-label">Descriptor</label>
                        <textarea id="input-ms-descriptor" class="input-text input-textarea"
                                  placeholder="multi(2,pk1hex,...) or multi_hd(2,xpub,...)" rows="3"
                                  autocomplete="off" spellcheck="false"></textarea>
                        <button class="btn btn-outline u-full-width-mt-4px-text-12px" id="btn-scan-ms-descriptor"
                               >📷 Scan Descriptor QR</button>
                        <label class="input-label" for="input-ms-cosigner">45' Cosigner Branch</label>
                        <input type="number" id="input-ms-cosigner" class="input-text" value="0" placeholder="0" min="0" max="4" step="1" autocomplete="off">
                        <div class="send-balance-ref u-mt-4px">Branch 0 is the default; use the cosigner index shown by KasSigner.</div>
                        <button class="btn btn-outline u-full-width-mt-4px-text-12px" id="btn-ms-discover">
                            Discover Receive / Change Addresses
                        </button>
                        <div id="ms-discovery-info" class="send-balance-ref u-mt-8px"></div>
                        <div id="ms-branch-utxos" class="address-list hidden"></div>
                        <label class="input-label">Source Address (P2SH)</label>
                        <div class="u-display-flex-gap-8px-align-start">
                            <input type="text" id="input-ms-source" class="input-text u-grow-mb-0"
                                   placeholder="kaspa:pr..." autocomplete="off" spellcheck="false">
                            <button class="btn btn-outline u-width-auto-padding-13px-16px-no-shrink-mt-0" id="btn-scan-ms-source"
                                    title="Scan QR">📷</button>
                        </div>
                        <label class="input-label">Destination Address</label>
                        <div class="u-display-flex-gap-8px-align-start">
                            <input type="text" id="input-ms-dest" class="input-text u-grow-mb-0"
                                   placeholder="kaspa:..." autocomplete="off" spellcheck="false">
                            <button class="btn btn-outline u-width-auto-padding-13px-16px-no-shrink-mt-0" id="btn-scan-ms-dest"
                                    title="Scan QR">📷</button>
                        </div>
                        <label class="input-label">Amount (KAS)</label>
                        <div class="u-display-flex-gap-8px-align-start">
                            <input type="number" id="input-ms-amount" class="input-text u-grow-mb-0"
                                   placeholder="0.0" step="0.00000001" min="0">
                            <button class="btn btn-outline u-width-auto-padding-13px-16px-no-shrink-mt-0" id="btn-ms-max"
                                   >Max</button>
                        </div>
                        <div id="ms-balance-info" class="send-balance-ref u-mt-8px"></div>
                        <button class="btn btn-link u-text-12px-padding-4px-0-mb-8px-align-text-left" id="btn-toggle-ms-utxos">
                            Select UTXOs manually ▸
                        </button>
                        <div id="ms-utxo-list" class="address-list hidden"></div>
                        <button class="btn btn-primary u-mt-12px" id="btn-ms-create">
                            Create Multisig TX
                        </button>
                        <button class="btn btn-back" id="btn-ms-back">Back</button>
                    </div>
                </div>
            </section>
