
                        <!-- Escrow-specific fields -->
                        <div id="cov-fields-escrow" class="hidden">
                            <p class="u-text-11px-text-text-dim-margin-0-0-8px-line-1-4">
                                2-of-3 escrow: buyer, seller, and arbiter.<br>
                                Addresses derived automatically from pubkeys.
                            </p>
                            <label class="input-label">Seller Pubkey (hex)</label>
                            <div class="u-display-flex-gap-8px-align-start">
                                <input type="text" id="cov-escrow-pk" class="input-text u-grow-mb-0"
                                       placeholder="32-byte xonly pubkey hex" autocomplete="off" spellcheck="false">
                                <button class="btn btn-outline u-width-auto-padding-13px-16px-no-shrink-mt-0" id="btn-cov-scan-escrow-pk"
                                        title="Scan QR">📷</button>
                            </div>
                            <label class="input-label">Arbiter Pubkey (hex)</label>
                            <div class="u-display-flex-gap-8px-align-start">
                                <input type="text" id="cov-escrow-arbiter-pk" class="input-text u-grow-mb-0"
                                       placeholder="32-byte xonly pubkey hex" autocomplete="off" spellcheck="false">
                                <button class="btn btn-outline u-width-auto-padding-13px-16px-no-shrink-mt-0" id="btn-cov-scan-escrow-arbiter"
                                        title="Scan QR">📷</button>
                            </div>
                        </div>
