                    <!-- Borrower spend sub-screen -->
                    <div id="cov-borrower-panel" class="card hidden">
                        <label class="input-label">Borrower Mode</label>
                        <select id="cov-borrower-mode" class="input-text">
                            <option value="additive">Additive (add funds to covenant)</option>
                            <option value="withdraw">Withdraw (spending limit)</option>
                        </select>
                        <label class="input-label">Covenant Address (P2SH)</label>
                        <div class="u-display-flex-gap-8px-align-start">
                            <input type="text" id="cov-borrower-addr" class="input-text u-grow-mb-0"
                                   placeholder="kaspatest:pr..." autocomplete="off" spellcheck="false">
                            <button class="btn btn-outline u-width-auto-padding-13px-16px-no-shrink-mt-0" id="btn-cov-scan-borrower-addr"
                                    title="Scan QR">📷</button>
                        </div>
                        <label class="input-label">Redeem Script (hex)</label>
                        <textarea id="cov-borrower-script" class="input-text input-textarea"
                                  placeholder="6320...68" rows="2" autocomplete="off" spellcheck="false"></textarea>
                        <label class="input-label" id="cov-borrower-amount-label">Amount (KAS)</label>
                        <input type="number" id="cov-borrower-amount" class="input-text"
                               placeholder="10" step="0.00000001" min="0">
                        <div class="u-mt-8px" id="cov-borrower-fee-picker">
                            <label class="input-label u-text-10px">Fee Level</label>
                            <div class="u-display-flex-gap-4px">
                                <button class="btn btn-outline cov-fee-btn u-grow-padding-6px-text-11px" data-cov-fee="low">Low</button>
                                <button class="btn btn-outline cov-fee-btn cov-fee-active u-grow-padding-6px-text-11px" data-cov-fee="normal">Normal</button>
                                <button class="btn btn-outline cov-fee-btn u-grow-padding-6px-text-11px" data-cov-fee="priority">Priority</button>
                            </div>
                        </div>
                        <button class="btn btn-primary u-mt-12px-full-width" id="btn-cov-borrower-create">
                            Create Borrower TX
                        </button>
                        <button class="btn btn-back" id="btn-cov-borrower-back">Back</button>
                    </div>
