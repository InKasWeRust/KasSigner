                    <!-- Beneficiary spend sub-screen (time-locked vault) -->
                    <div id="cov-beneficiary-panel" class="card hidden">
                        <div class="u-text-11px-text-text-dim-margin-0-0-10px-line-1-4" id="cov-bene-help"></div>
                        <div class="u-hidden">
                            <input type="text" id="cov-bene-addr">
                            <textarea id="cov-bene-script"></textarea>
                        </div>
                        <div id="cov-bene-locktime-wrap">
                            <label class="input-label">Locktime (DAA score)</label>
                            <input type="number" id="cov-bene-locktime" class="input-text"
                                   placeholder="Same value used at creation" min="1" step="1">
                        </div>
                        <div class="u-hidden" id="cov-bene-amount-wrap">
                            <label class="input-label">Withdraw Amount (KAS)</label>
                            <div class="u-display-flex-gap-8px-align-start">
                                <input type="number" id="cov-bene-amount" class="input-text u-grow-mb-0"
                                       placeholder="Amount to withdraw" step="0.00000001" min="0">
                                <button class="btn btn-outline" id="btn-cov-bene-max">Max</button>
                            </div>
                        </div>
                        <label class="input-label">Destination Address</label>
                        <div class="u-display-flex-gap-8px-align-start">
                            <input type="text" id="cov-bene-dest" class="input-text u-grow-mb-0"
                                   placeholder="kaspatest:qq..." autocomplete="off" spellcheck="false">
                            <button class="btn btn-outline u-width-auto-padding-13px-16px-no-shrink-mt-0" id="btn-cov-scan-bene-dest"
                                    title="Scan QR">📷</button>
                        </div>
                        <div class="u-mt-8px" id="cov-bene-fee-picker">
                            <label class="input-label u-text-10px">Fee Level</label>
                            <div class="u-display-flex-gap-4px">
                                <button class="btn btn-outline cov-fee-btn u-grow-padding-6px-text-11px" data-cov-fee="low">Low</button>
                                <button class="btn btn-outline cov-fee-btn cov-fee-active u-grow-padding-6px-text-11px" data-cov-fee="normal">Normal</button>
                                <button class="btn btn-outline cov-fee-btn u-grow-padding-6px-text-11px" data-cov-fee="priority">Priority</button>
                            </div>
                        </div>
                        <button class="btn btn-primary u-mt-12px-full-width" id="btn-cov-bene-create">
                            Create Release TX
                        </button>
                        <button class="btn btn-outline u-hidden-full-width-action" id="btn-cov-bene-pick">Select UTXO(s) to claim (advanced)</button>
                        <button class="btn btn-back" id="btn-cov-bene-back">Back</button>
                    </div>
