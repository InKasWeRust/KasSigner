#
# The compiler rustup runs here when none is named: Rust 1.95.0, the
# workspace's `rust-version` and the Rust that esp-rs's Xtensa toolchain
# (`esp195`) is built on, so formatting and lints match the units' builds.
# CI installs the same version.
#
# A toolchain named on the command line (`cargo +esp195 ...`) or in
# `RUSTUP_TOOLCHAIN` still wins, `vendor/rqrr` keeps its own pin, and the
# release build (`release/Dockerfile`) has no rustup and never reads this.
#
# Raise it with the workspace's `rust-version` and a clippy run, not
# incidentally. The name has a HYPHEN: rustup ignores rust_toolchain.toml.

[toolchain]
channel = "1.95.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
